# Copy to settings.conf and fill in. settings.conf is gitignored: this
# repository is public and these addresses are not.

# Prometheus, reached directly over the LAN. Read-only queries; no credentials
# are involved, which is why this app ships without a key of any kind.
prometheus = http://10.0.0.x:9090

# The console, for the latency probe. A TCP handshake is timed against the
# port below, so pick one that is reliably open and cheap to connect to.
# Leave host blank to drop the latency row entirely.
host = 10.0.0.x
port = 22

# Seconds between automatic refreshes, and the per-query timeout.
refresh = 15
timeout = 5
