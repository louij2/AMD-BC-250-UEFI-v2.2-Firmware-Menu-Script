# RetroArch configuration for the Steam Link.
#
# Based on the SDK example's config, with the storage paths pointed at the
# ROM share and a few choices forced for this hardware.
#
# Paths worth understanding before editing:
#
#   /home/apps/retroarch   where the device installs this app, so it is where
#                          the cores (*_libretro.so) end up.
#   /mnt/roms              the NFS mount of the console's @roms subvolume,
#                          which already holds bios/, roms/ and saves/.
#
# If /mnt/roms is not mounted, RetroArch still starts -- it just shows an
# empty file browser, which is the right failure: no silent fallback to a
# local directory that would strand saves in flash.

config_save_on_exit = "false"

# Drivers. The hardware is OpenGL ES 2 only, and the front end is built
# --disable-threads, so nothing here may assume a second core.
video_driver = "gl"
audio_driver = "sdl2"
audio_resampler = "sinc"
input_driver = "sdl2"
input_joypad_driver = "sdl2"

# rgui, not xmb or ozone: it is the only menu driver that is comfortable on a
# single 1GHz core, and it reads perfectly well on a TV.
menu_driver = "rgui"

# Cores sit next to the binary in the app directory.
libretro_directory = "/home/apps/retroarch"
libretro_info_path = ":/.home/.config/retroarch/cores"

# --- the ROM share -----------------------------------------------------
# The library is Unraid's existing Games share, which is already NFS-exported
# read-only to everyone -- no new share and no new service was needed. Mount it
# on the device with:
#
#   mount -t nfs -o vers=3,ro,nolock 10.0.0.24:/mnt/user/Games /mnt/games
#
# vers=3 is not optional: this kernel has NFSv3 built in, and CIFS without
# SMB2, so NFSv3 is the only network filesystem available to it.
#
# BIOS images live in that share too, so system_directory points straight at
# them rather than duplicating 117MB into the device's ~1GB of flash.
rgui_browser_directory = "/mnt/games"
system_directory = "/mnt/games/Bios"

# Saves stay local, because the Games export is read-only. They are a few KB
# each, so flash is fine, and a read-only ROM share is the safer default: a
# misbehaving core cannot write into the library.
savefile_directory = "default"
savestate_directory = "default"

# Everything else stays inside the app, which the device makes writable.
screenshot_directory = "default"
content_database_path = ":/.home/.config/retroarch/database/rdb"
cheat_database_path = ":/.home/.config/retroarch/cheats"
content_history_path = ":/.home/.config/retroarch/content_history.lpl"
content_music_history_path = ":/.home/.config/retroarch/content_music_history.lpl"
content_video_history_path = ":/.home/.config/retroarch/content_video_history.lpl"
content_image_history_path = ":/.home/.config/retroarch/content_image_history.lpl"
cursor_directory = ":/.home/.config/retroarch/database/cursors"
input_remapping_directory = ":/.home/.config/retroarch/config/remaps"
video_shader_dir = ":/.home/.config/retroarch/shaders"
video_filter_dir = "default"
core_assets_directory = ":/.home/.config/retroarch/downloads"
assets_directory = ":/.home/.config/retroarch/assets"
dynamic_wallpapers_directory = "default"
core_updater_buildbot_assets_url = "http://buildbot.libretro.com/assets/"

# --- performance ---------------------------------------------------------
# Autosave writes over NFS; every interval is a network round trip, so keep
# it off and rely on the cores' own save-on-exit.
autosave_interval = "0"

# Rewind keeps a ring buffer of states in RAM. On a 256MB box that is the
# difference between running and swapping.
rewind_enable = "false"

# The device has no battery and no second display; skip the work.
video_font_enable = "true"
fps_show = "false"
