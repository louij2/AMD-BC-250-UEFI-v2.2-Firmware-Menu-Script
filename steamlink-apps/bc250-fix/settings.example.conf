# Copy to settings.conf and fill in. settings.conf is gitignored: this
# repository is public and these values are not.
#
# The Steam Link cannot run Tailscale, so host is the BC-250's LAN address,
# not its tailnet one.

host = 10.0.0.x
user = your-bc250-user

# Private key shipped inside the app directory. Generate a dedicated one --
# never reuse a personal key, because anything on a FAT32 USB stick and an
# unauthenticated device is effectively public:
#
#   ssh-keygen -t ed25519 -N '' -C steamlink-fix -f id_steamlink
#
# Then authorise it on the BC-250 with a forced command, so this key can
# trigger the three recovery actions and nothing else. In ~/.ssh/authorized_keys:
#
#   restrict,command="/home/YOURUSER/Reboot-to-UEFI/bc250-recovery-remote" ssh-ed25519 AAAA... steamlink-fix
#
# The app sends only a bare word (fix, wake or reset); the wrapper validates
# it and refuses anything else.
key = id_steamlink

# Seconds to wait for the BC-250 to answer.
timeout = 8
